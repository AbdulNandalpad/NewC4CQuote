_schema-version: 3.3.0
ID: NewC4CQuote
version: 1.0.0
description: >
  C4C Quote tooling on SAP BTP / Cloud Foundry: a standalone pricing
  simulation app, and a replica of the C4C Quote items tab meant to be
  embedded back into C4C as a URL Mashup.

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # SAP CAP backend: OData services for both apps (/pricing, /quote-items).
  # No auth is enforced yet — deliberately deferred. XSUAA-gating
  # PricingService (app/router, xs-security.json) was built and verified,
  # then intentionally deactivated so the rest of the app can be finished
  # first; that work resumes as its own OBO/authorization phase. See
  # README "Open items".
  - name: NewC4CQuote-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: NewC4CQuote-destination
      - name: tss-pricing-ai-ui
      - name: quote-items-ui
    properties:
      ALLOWED_ORIGINS: ~{tss-pricing-ai-ui/url},~{quote-items-ui/url}

  # Part 1: standalone pricing simulation UI (React/Vite), served by its own
  # small Express static server so response headers stay under our control.
  # Deployed/branded as "TSS Pricing AI" (module name drives both the CF app
  # name and its default route/URL).
  - name: tss-pricing-ai
    type: nodejs
    path: app/tss-pricing-ai
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 256M
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
    provides:
      - name: tss-pricing-ai-ui
        properties:
          url: ${default-url}
    requires:
      - name: srv-api
    properties:
      API_ORIGIN: ~{srv-api/srv-url}

  # Part 2: C4C Quote items replica UI (React/Vite) — this is the module
  # meant to be embedded as a C4C URL Mashup iframe. FRAME_ANCESTORS must be
  # set to the real C4C tenant domain(s) before deploying to a real tenant;
  # it defaults to 'self' (same-origin only, i.e. NOT embeddable) so an
  # unconfigured deploy fails closed rather than open.
  - name: quote-items
    type: nodejs
    path: app/quote-items
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 256M
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
    provides:
      - name: quote-items-ui
        properties:
          url: ${default-url}
    requires:
      - name: srv-api
    properties:
      API_ORIGIN: ~{srv-api/srv-url}
      FRAME_ANCESTORS: "'self'"

  # MCP server: exposes calculatePrices / fetchCostFromERP / fetchCostFromBI /
  # RateConfig to any MCP-speaking external agent over Streamable HTTP at
  # POST /mcp. No credentials are stored here — every tool call passes the
  # caller's own Authorization header straight through to PricingService, so
  # a caller authenticates as the same PricingUser Basic Auth account used
  # by the TSS Pricing AI UI, and CAP is what actually accepts/rejects it.
  - name: pricing-mcp-server
    type: nodejs
    path: app/mcp-server
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 256M
    build-parameters:
      builder: npm
    provides:
      - name: pricing-mcp-ui
        properties:
          url: ${default-url}
    requires:
      - name: srv-api
    properties:
      API_ORIGIN: ~{srv-api/srv-url}

resources:
  # Provides destination lookup for srv's outbound call to API6 (ERP + BI
  # Central Cost DB). The service instance is provisioned here, but the
  # actual "API6" destination (URL, auth) is NOT — that must be created by
  # hand in BTP Cockpit → Connectivity → Destinations once the real API6
  # endpoint/auth details are known. See README "Open items".
  - name: NewC4CQuote-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
